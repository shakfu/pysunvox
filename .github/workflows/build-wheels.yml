name: Build Wheels

on: [workflow_dispatch]
  # push:
  #   branches: [master, main]
  #   tags: ["v*"]
  # pull_request:
  #   branches: [master, main]
  # workflow_dispatch:

# scripts/fetch_sunvox_lib.py downloads the SunVox library into thirdparty/.
#
# Available SunVox dynamic libraries constrain which wheels can be built:
#   macOS:   lib_x86_64/sunvox.dylib, lib_arm64/sunvox.dylib
#   Linux:   lib_x86_64/sunvox.so, lib_x86/sunvox.so, lib_arm64/sunvox.so, lib_arm/sunvox.so
#   Windows: lib_x86_64/sunvox.dll, lib_x86/sunvox.dll
#
# musllinux is not supported (sunvox libraries are glibc-linked)
# 32-bit builds (i686, win32) are skipped due to declining Python support
#
# The Linux sunvox.so references GLIBC_2.34, so manylinux_2_28 cannot host it.
# Linux aarch64 uses a native ARM runner rather than QEMU emulation.

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: linux-x86_64, os: ubuntu-latest, archs: x86_64 }
          - { id: linux-aarch64, os: ubuntu-24.04-arm, archs: aarch64 }
          - { id: macos, os: macos-latest, archs: "x86_64 arm64" }
          - { id: windows, os: windows-latest, archs: AMD64 }

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true

      # The SunVox binaries are not in git. Fetch on the host, before
      # cibuildwheel: on Linux the project directory is mounted into the
      # manylinux container, so the container sees them too.
      - name: Fetch SunVox library
        run: uv run --no-project --python 3.13 scripts/fetch_sunvox_lib.py

      - name: Build wheels
        run: uvx cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          # Skip musllinux (no glibc) and 32-bit (declining support)
          CIBW_SKIP: "*-musllinux_* *-win32 *_i686"
          CIBW_ARCHS: ${{ matrix.archs }}
          # sunvox.so needs GLIBC_2.34; manylinux_2_28 rejects it
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_34
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_34
          # sunvox.so links libasound.so.2, absent from the manylinux images
          CIBW_BEFORE_ALL_LINUX: "dnf install -y alsa-lib"
          # Leave libasound.so.2 unvendored so ALSA resolves its own plugins and
          # config from the host installation
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --exclude libasound.so.2 -w {dest_dir} {wheel}
          # CMake already installs sunvox.dll beside _core.pyd, which is where
          # CPython's LOAD_WITH_ALTERED_SEARCH_PATH finds it
          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: >-
            delvewheel repair --exclude sunvox.dll -w {dest_dir} {wheel}
          # The x86_64 sunvox.dylib has a minimum target of 10.12, above the
          # 10.9 cibuildwheel would otherwise tag cp310/cp311 wheels with.
          # cibuildwheel treats this as a floor, raising it to 10.13/10.15 for
          # newer CPython and to 11.0 for arm64.
          MACOSX_DEPLOYMENT_TARGET: "10.13"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest {project}/tests -v
          CIBW_BEFORE_BUILD: "uv pip install --system cython scikit-build-core"

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.id }}
          path: ./wheelhouse/*.whl

  aggregate_wheels:
    name: Aggregate all wheels
    needs: [build_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: all-wheels
          merge-multiple: true

      - uses: actions/upload-artifact@v7
        with:
          name: all-wheels
          path: all-wheels/*.whl

  # build_sdist:
  #   name: Build source distribution
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4

  #     - name: Set up uv
  #       uses: astral-sh/setup-uv@v5
  #       with:
  #         enable-cache: true

  #     - name: Build sdist
  #       run: uv build --sdist

  #     - uses: actions/upload-artifact@v4
  #       with:
  #         name: sdist
  #         path: dist/*.tar.gz

  check:
    name: Check distributions
    needs: [build_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Check distributions
        run: uvx twine check dist/*

  publish-test:
    name: Publish to TestPyPI
    needs: [check]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pysunvox
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    name: Publish to PyPI
    needs: [publish-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/pysunvox
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
